<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackHouse | Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 { font-size: 24px; font-weight: 750; color: white; }
        
        .cart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .cart-btn:hover { background-color: var(--primary-hover); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .product-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: white; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--accent-color); margin-bottom: 15px; }

        .btn-add {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: #047857; }

        .admin-link {
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-top: 40px;
        }
        .admin-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SnackHouse ⚡</h1>
            <a href="carrito.html" class="cart-btn" id="cart-counter">🛒 Ver Carrito (0)</a>
        </header>

        <div class="grid" id="product-grid">
            <!-- Los productos se cargan dinámicamente -->
        </div>

        <a href="adminpedidos.html" class="admin-link">🔒 Acceso al Panel de Administración</a>
    </div>

    <script>
        // Catálogo actualizado de productos
        const productos = [
            { id: 1, name: "Doritos", price: 20 },
            { id: 2, name: "Takis Fuego", price: 22 },
            { id: 3, name: "Pulparindo", price: 8 },
            { id: 4, name: "Gomitas de Sandía", price: 12 },
            { id: 5, name: "Chicles Trident (Menta)", price: 15 },
            { id: 6, name: "Cacahuate Japonés", price: 14 },
            { id: 7, name: "Cacahuates Picantes", price: 14 },
            { id: 8, name: "Cacahuates Salados", price: 14 },
            { id: 9, name: "Takis Azules", price: 22 },
            { id: 10, name: "Chips Fuego", price: 20 }
        ];

        function cargarProductos() {
            let grid = document.getElementById('product-grid');
            grid.innerHTML = "";

            productos.forEach(p => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">$${p.price}.00 MXN</div>
                    </div>
                    <button class="btn-add" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito ➕</button>
                `;
                grid.appendChild(card);
            });
            actualizarContadorCarrito();
        }

        function agregarAlCarrito(idProducto) {
            let productoSeleccionado = productos.find(p => p.id === idProducto);
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];

            let index = carrito.findIndex(item => item.id === idProducto);
            if (index !== -1) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({ ...productoSeleccionado, cantidad: 1 });
            }

            localStorage.setItem('snackhouse_carrito', JSON.stringify(carrito));
            actualizarContadorCarrito();
            
            // Pequeña alerta visual rápida
            alert(`¡Agregado al carrito: ${productoSeleccionado.name}!`);
        }

        function actualizarContadorCarrito() {
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById('cart-counter').innerText = `🛒 Ver Carrito (${totalItems})`;
        }

        cargarProductos();
    </script>
</body>
</html>
