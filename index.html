<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackHouse | Antojos al Receso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            padding: 40px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            padding: 20px 30px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .logo { font-size: 20px; font-weight: 700; color: white; }
        
        .cart-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .cart-btn:hover { background-color: var(--primary-hover); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
        }

        .product-img {
            width: 100%;
            height: 120px;
            background-color: #1c1c24;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .product-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--accent-color); margin-bottom: 15px; }

        .btn-add {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">SnackHouse 🍫</div>
            <a href="carrito.html" class="cart-btn">Ver Carrito 🛒</a>
        </div>

        <div class="grid" id="product-grid">
            <!-- Dinámico -->
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, name: "Doritos", price: 20, emoji: "🔺", desc: "Los clásicos totopos crujientes con su toque de queso y chile.", disponible: true },
            { id: 2, name: "Takis Fuego", price: 22, emoji: "🔥", desc: "Rollo de maíz crujiente con intenso sabor a chile y limón.", disponible: true },
            { id: 3, name: "Pulparindo", price: 8, emoji: "🍬", desc: "Dulce de pulpa de tamarindo natural con sal y chile.", disponible: true },
            { id: 4, name: "Gomitas de Sandía", price: 12, emoji: "🍉", desc: "Gomitas azucaradas con forma y sabor a sandía acidita.", disponible: true },
            { id: 5, name: "Chicles Trident (Menta)", price: 15, emoji: "🍃", desc: "Chicles sin azúcar sabor menta refrescante para el aliento.", disponible: false },
            { id: 6, name: "Cacahuate Japonés", price: 22, emoji: "🥜", desc: "Cacahuates crujientes con capa dorada de harina y soya.", disponible: true },
            { id: 7, name: "Cacahuates Picantes", price: 22, emoji: "🌶️", desc: "Cacahuates tostados con una capa crujiente y picante.", disponible: true },
            { id: 8, name: "Cacahuates Salados", price: 22, emoji: "🧂", desc: "Cacahuates clásicos tostados y con su punto exacto de sal.", disponible: true },
            { id: 9, name: "Takis Azules", price: 22, emoji: "🌀", desc: "La versión extrema de Takis con un toque picante y llamativo color.", disponible: true },
            { id: 10, name: "Chips Fuego", price: 20, emoji: "🥔", desc: "Papas crujientes artesanales con chile y limón bien potente.", disponible: true }
        ];

        const grid = document.getElementById('product-grid');
        productos.forEach(p => {
            let card = document.createElement('a');
            card.href = `producto.html?id=${p.id}`;
            card.className = 'card';
            
            let botonHTML = p.disponible 
                ? `<button class="btn-add" onclick="agregarAlCarrito(${p.id}, event)">Agregar al Carrito 🛒</button>`
                : `<button class="btn-add" style="background-color: #3f3f46; color: #a1a1aa; cursor: not-allowed;" disabled>Agotado ❌</button>`;

            card.innerHTML = `
                <div style="${!p.disponible ? 'opacity: 0.5;' : ''}">
                    <div class="product-img">${p.emoji}</div>
                    <div class="product-name">${p.name} ${!p.disponible ? '<span style="font-size:11px; color:#ef4444; font-weight:normal;">(Agotado)</span>' : ''}</div>
                    <div class="product-price">$${p.price}.00 MXN</div>
                </div>
                ${botonHTML}
            `;
            grid.appendChild(card);
        });

        function agregarAlCarrito(id, event) {
            event.preventDefault();
            let productoSeleccionado = productos.find(p => p.id === id);
            if (!productoSeleccionado.disponible) return;

            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            let index = carrito.findIndex(item => item.id === id);
            if (index > -1) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({ ...productoSeleccionado, cantidad: 1 });
            }
            localStorage.setItem('snackhouse_carrito', JSON.stringify(carrito));
            alert(`¡Agregado al carrito: ${productoSeleccionado.name}!`);
        }
    </script>
</body>
</html>
