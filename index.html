<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackHouse | Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            animation: fadeIn 0.4s ease-out;
            padding-bottom: 60px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background-color: rgba(5, 5, 7, 0.85);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .brand span { color: var(--accent-color); }

        .cart-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .cart-btn:hover {
            border-color: var(--primary-color);
            background-color: #1a1a24;
        }
        #cart-count {
            background-color: var(--accent-color);
            color: #000;
            padding: 2px 7px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }
        .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero p { color: var(--text-muted); font-size: 14px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            border-color: var(--primary-color);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.2);
        }

        .product-img {
            width: 100%;
            height: 120px;
            background-color: #1c1c24;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 14px;
        }

        .product-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #fff; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--accent-color); margin-bottom: 14px; }
        
        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">Snack<span>House</span></a>
        <a href="carrito.html" class="cart-btn">
            🛒 Carrito <span id="cart-count">0</span>
        </a>
    </header>

    <div class="container">
        <div class="hero">
            <h1>SnackHouse | Antojos al Receso</h1>
            <p>Surtido directo para calmar el hambre de la última clase. ¡Pídelo aquí y recógelo en corto!</p>
        </div>

        <div class="grid" id="product-grid">
            <!-- Dinámico -->
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, name: "Paleta Takis / Skwinkles", price: 12, emoji: "🍭", desc: "La clásica paleta con su respectivo polvo acidito para sobrevivir las matemáticas." },
            { id: 2, name: "Lucas Muecas", price: 15, emoji: "🌶️", desc: "Caramelo macizo con polvo picante sabor chamoy. Un clásico inquebrantable." },
            { id: 3, name: "Duvalín", price: 8, emoji: "🍫", desc: "Avellana y fresa con vainilla para embarrar con la cucharita o el dedo." },
            { id: 4, name: "Bubulubu", price: 10, emoji: "🍓", desc: "Malvavisco cubierto de chocolate y mermelada de fresa. Delicia de recreo." },
            { id: 5, name: "Pica Fresas (Bolsita x5)", price: 7, emoji: "🍓", desc: "Gomitas sabor fresa con chilito en polvo. Baratas y adictivas." },
            { id: 6, name: "Borrachitos Artesanales", price: 10, emoji: "🍬", desc: "Dulces típicos suaves espolvoreados con azúcar. Sabor a fiesta patronal." },
            { id: 7, name: "Chicles Canels (Paquete)", price: 6, emoji: "🟢", desc: "El chicle que pierde el sabor en 45 segundos pero rifa para el aliento." },
            { id: 8, name: "Papas Fritos (Barcel/Sabritas)", price: 18, emoji: "🥔", desc: "Las crujientes obligatorias para el bajón de la tercera hora." },
            { id: 9, name: "Jugo Del Valle / Boing", price: 14, emoji: "🧃", desc: "De mango o guayaba para acompañar cualquier antojo salado." },
            { id: 10, name: "Paleta Dr. Blowpop", price: 9, emoji: "🍭", desc: "Caramelo con chicle interior para exprimirle las últimas fuerzas al día." }
        ];

        function actualizarContador() {
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById('cart-count').innerText = totalItems;
        }

        function agregarAlCarrito(id, event) {
            event.stopPropagation();
            event.preventDefault();
            
            let producto = productos.find(p => p.id === id);
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            
            let index = carrito.findIndex(p => p.id === id);
            if (index > -1) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }

            localStorage.setItem('snackhouse_carrito', JSON.stringify(carrito));
            actualizarContador();
            
            let btn = event.target;
            let originalText = btn.innerText;
            btn.innerText = "¡Agregado! ✔";
            btn.style.backgroundColor = "#059669";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "";
            }, 700);
        }

        const grid = document.getElementById('product-grid');
        productos.forEach(p => {
            let card = document.createElement('a');
            card.href = `producto.html?id=${p.id}`;
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="product-img">${p.emoji}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">$${p.price}.00 MXN</div>
                </div>
                <button class="btn-add" onclick="agregarAlCarrito(${p.id}, event)">Agregar al Carrito 🛒</button>
            `;
            grid.appendChild(card);
        });

        actualizarContador();
    </script>
</body>
</html>
