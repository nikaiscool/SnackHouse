<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout y Entrega | SnackHouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            padding: 40px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 12px;
            background-color: #1a1a24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary-color); }

        .zone-img {
            width: 100%;
            height: 180px;
            background-color: #1c1c24;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            object-fit: cover;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .instructions-box {
            background-color: rgba(245, 158, 11, 0.08);
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            font-size: 13.5px;
            color: #fef3c7;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        .instructions-box b { color: var(--accent-color); }

        .btn-enviar {
            display: block;
            width: 100%;
            background-color: #059669;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-enviar:hover { background-color: #047857; }
        .btn-enviar:active { transform: scale(0.98); }

        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Finalizar Solicitud | SnackHouse 📦</h1>

        <div class="form-group">
            <label for="nombre">Tu Nombre o Apodo en el Salón:</label>
            <input type="text" id="nombre" placeholder="Escribe tu nombre aquí..." oninput="actualizarTexto()">
        </div>

        <div class="form-group">
            <label>Zona de Entrega (Punto Operativo):</label>
            <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=600&auto=format&fit=crop&q=80" alt="Zona de Entrega" class="zone-img">
            <span style="font-size: 11px; color: var(--text-muted);">Área designada: Canchas / Bancas principales del patio central.</span>
        </div>

        <div class="instructions-box" id="instrucciones-texto">
            Cargando detalles de tu pedido...
        </div>

        <button class="btn-enviar" onclick="enviarPedido()">Enviar Pedido 📦</button>

        <a href="carrito.html" class="back-link">&larr; Volver al Carrito</a>
    </div>

    <script>
        function actualizarTexto() {
            let nombre = document.getElementById('nombre').value.trim() || "[Tu Nombre]";
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            
            let resumenArticulos = carrito.map(item => `${item.cantidad}x ${item.name}`).join(", ");
            if (resumenArticulos === "") {
                resumenArticulos = "ningún artículo seleccionado";
            }

            let textoInstrucciones = `Para pedir tus artículos deseados (<b>${resumenArticulos}</b>) deberás llevar tu dinero y ir en el primer receso a la zona indicada. <b>No se fiaran productos.</b> Atentamente registrado para: <b>${nombre}</b>.`;
            
            document.getElementById('instrucciones-texto').innerHTML = textoInstrucciones;
        }

        function enviarPedido() {
            let nombre = document.getElementById('nombre').value.trim();
            if (!nombre) {
                alert("Por favor escribe tu nombre o apodo antes de enviar el pedido.");
                document.getElementById('nombre').focus();
                return;
            }

            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                window.location.href = "index.html";
                return;
            }

            let total = carrito.reduce((sum, item) => sum + (item.price * item.cantidad), 0);
            let nuevoPedido = {
                id: Date.now(),
                cliente: nombre,
                productos: carrito,
                total: total,
                estado: 'pendiente', // pendiente, aceptado, rechazado
                fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let listaPedidos = JSON.parse(localStorage.getItem('snackhouse_pedidos_admin')) || [];
            listaPedidos.push(nuevoPedido);
            localStorage.setItem('snackhouse_pedidos_admin', JSON.stringify(listaPedidos));

            // Limpiar carrito
            localStorage.removeItem('snackhouse_carrito');

            alert("¡Pedido enviado con éxito! Recoge tus snacks en la zona indicada llevando tu dinero.");
            window.location.href = "index.html";
        }

        actualizarTexto();
    </script>
</body>
</html>
