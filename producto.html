<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | SnackHouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 40px 20px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .product-img-large {
            width: 100%;
            height: 200px;
            background-color: #1c1c24;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: white; }
        .product-price { font-size: 20px; font-weight: 700; color: var(--accent-color); margin-bottom: 16px; }
        .product-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .btn-add {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-add:hover { background-color: var(--primary-hover); }
        .btn-add:active { transform: scale(0.98); }

        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="container" id="product-container">
        <!-- Se llena dinámicamente -->
    </div>

    <script>
        // Mismo catálogo sincronizado
        const productos = [
            { id: 1, name: "Doritos", price: 20, emoji: "🔺", desc: "Los clásicos totopos crujientes con su toque de queso y chile." },
            { id: 2, name: "Takis Fuego", price: 22, emoji: "🔥", desc: "Rollo de maíz crujiente con intenso sabor a chile y limón." },
            { id: 3, name: "Pulparindo", price: 8, emoji: "🍬", desc: "Dulce de pulpa de tamarindo natural con sal y chile." },
            { id: 4, name: "Gomitas de Sandía", price: 12, emoji: "🍉", desc: "Gomitas azucaradas con forma y sabor a sandía acidita." },
            { id: 5, name: "Chicles Trident (Menta)", price: SIN STOCK, emoji: "🍃", desc: "Chicles sin azúcar sabor menta refrescante para el aliento." },
            { id: 6, name: "Cacahuate Japonés", price: 20, emoji: "🥜", desc: "Cacahuates crujientes con capa dorada de harina y soya." },
            { id: 7, name: "Cacahuates Picantes", price: 20, emoji: "🌶️", desc: "Cacahuates tostados con una capa crujiente y picante." },
            { id: 8, name: "Cacahuates Salados", price: 20, emoji: "🧂", desc: "Cacahuates clásicos tostados y con su punto exacto de sal." },
            { id: 9, name: "Takis Azules", price: 22, emoji: "🌀", desc: "La versión extrema de Takis con un toque picante y llamativo color." },
            { id: 10, name: "Chips Fuego", price: 20, emoji: "🥔", desc: "Papas crujientes artesanales con chile y limón bien potente." }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        let producto = productos.find(p => p.id === productId);
        let container = document.getElementById('product-container');

        if (producto) {
            container.innerHTML = `
                <div class="product-img-large">${producto.emoji}</div>
                <h1>${producto.name}</h1>
                <div class="product-price">$${producto.price}.00 MXN</div>
                <div class="product-desc">${producto.desc}</div>
                <button class="btn-add" onclick="agregarAlCarrito(${producto.id})">Agregar al Carrito 🛒</button>
                <br>
                <a href="index.html" class="back-link">&larr; Volver al Catálogo</a>
            `;
        } else {
            container.innerHTML = `
                <h1>Producto no encontrado</h1>
                <p class="product-desc">Lo sentimos, el producto que buscas no existe o fue removido.</p>
                <a href="index.html" class="back-link">&larr; Volver al Catálogo</a>
            `;
        }

        function agregarAlCarrito(id) {
            let productoSeleccionado = productos.find(p => p.id === id);
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];

            let index = carrito.findIndex(p => p.id === id);
            if (index > -1) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({ ...productoSeleccionado, cantidad: 1 });
            }

            localStorage.setItem('snackhouse_carrito', JSON.stringify(carrito));
            alert(`¡Agregado al carrito: ${productoSeleccionado.name}!`);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
