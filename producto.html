<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | SnackHouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #111116;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            padding: 40px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-color); }

        .product-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-emoji {
            font-size: 64px;
            background: #1c1c24;
            width: 100px;
            height: 100px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .price { font-size: 22px; font-weight: 700; color: var(--accent-color); margin-bottom: 16px; }
        .desc { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-action:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Volver al Catálogo</a>
        
        <div class="product-display">
            <div class="product-emoji" id="p-emoji">🍬</div>
            <h1 id="p-name">Cargando producto...</h1>
            <div class="price" id="p-price">$0.00 MXN</div>
            <p class="desc" id="p-desc">Cargando descripción detallada...</p>
        </div>

        <button class="btn-action" id="btn-comprar">Agregar al Carrito 🛒</button>
    </div>

    <script>
        const productos = [
            { id: 1, name: "Paleta Takis / Skwinkles", price: 12, emoji: "🍭", desc: "La clásica paleta con su respectivo polvo acidito para sobrevivir las matemáticas." },
            { id: 2, name: "Lucas Muecas", price: 15, emoji: "🌶️", desc: "Caramelo macizo con polvo picante sabor chamoy. Un clásico inquebrantable." },
            { id: 3, name: "Duvalín", price: 8, emoji: "🍫", desc: "Avellana y fresa con vainilla para embarrar con la cucharita o el dedo." },
            { id: 4, name: "Bubulubu", price: 10, emoji: "🍓", desc: "Malvavisco cubierto de chocolate y mermelada de fresa. Delicia de recreo." },
            { id: 5, name: "Pica Fresas (Bolsita x5)", price: 7, emoji: "🍓", desc: "Gomitas sabor fresa con chilito en polvo. Baratas y adictivas." },
            { id: 6, name: "Borrachitos Artesanales", price: 10, emoji: "🍬", desc: "Dulces típicos suaves espolvoreados con azúcar. Sabor a fiesta patronal." },
            { id: 7, name: "Chicles Canels (Paquete)", price: 6, emoji: "🟢", desc: "El chicle que pierde el sabor en 45 segundos pero rifa para el aliento." },
            { id: 8, name: "Papas Fritos (Barcel/Sabritas)", price: 18, emoji: "🥔", desc: "Las crujientes obligatorias para el bajón de la tercera hora." },
            { id: 9, name: "Jugo Del Valle / Boing", price: 14, emoji: "🧃", desc: "De mango o guayaba para acompañar cualquier antojo salado." },
            { id: 10, name: "Paleta Dr. Blowpop", price: 9, emoji: "🍭", desc: "Caramelo con chicle interior para exprimirle las últimas fuerzas al día." }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;
        const producto = productos.find(p => p.id === productId) || productos[0];

        document.getElementById('p-emoji').innerText = producto.emoji;
        document.getElementById('p-name').innerText = producto.name;
        document.getElementById('p-price').innerText = `$${producto.price}.00 MXN`;
        document.getElementById('p-desc').innerText = producto.desc;

        document.getElementById('btn-comprar').onclick = function() {
            let carrito = JSON.parse(localStorage.getItem('snackhouse_carrito')) || [];
            let index = carrito.findIndex(p => p.id === producto.id);
            if (index > -1) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            localStorage.setItem('snackhouse_carrito', JSON.stringify(carrito));
            
            let btn = document.getElementById('btn-comprar');
            btn.innerText = "¡Agregado al Carrito con Éxito! ✔";
            btn.style.backgroundColor = "#059669";
            setTimeout(() => {
                window.location.href = "carrito.html";
            }, 600);
        };
    </script>
</body>
</html>
